services:
  netbox:
    ports:
      - "8020:8080"
    # If you want the Nginx unit status page visible from the
    # outside of the container add the following port mapping:
    # - "8001:8081"
    # healthcheck:
      # Time for which the health check can fail after the container is started.
      # This depends mostly on the performance of your database. On the first start,
      # when all tables need to be created the start_period should be higher than on
      # subsequent starts. For the first start after major version upgrades of NetBox
      # the start_period might also need to be set higher.
      # Default value in our docker-compose.yml is 60s
      # start_period: 90s
      retries: 15
    # environment:
      # SKIP_SUPERUSER: "false"
      # SUPERUSER_API_TOKEN: ""
      # SUPERUSER_EMAIL: ""
      # SUPERUSER_NAME: ""
      # SUPERUSER_PASSWORD: ""
    volumes:
    - /opt/appdata/netbox/config:/etc/netbox/config:z,ro
    - /opt/appdata/netbox/media-files:/opt/netbox/netbox/media:z,rw
    - /opt/appdata/netbox/reports-files:/opt/netbox/netbox/reports:z,rw
    - /opt/appdata/netbox/files:/opt/netbox/netbox/scripts:z,rw
  netbox-worker:
    volumes:
    - /opt/appdata/netbox:/etc/netbox/config:z,ro
    - /opt/appdata/netbox/media-files:/opt/netbox/netbox/media:z,rw
    - /opt/appdata/netbox/reports-files:/opt/netbox/netbox/reports:z,rw
    - /opt/appdata/netbox/scripts-files:/opt/netbox/netbox/scripts:z,rw
  netbox-housekeeping:
    volumes:
    - //opt/appdata/netbox:/etc/netbox/config:z,ro
    - /opt/appdata/netbox/media-files:/opt/netbox/netbox/media:z,rw
    - /opt/appdata/netbox/reports-files:/opt/netbox/netbox/reports:z,rw
    - /opt/appdata/netbox/scripts-files:/opt/netbox/netbox/scripts:z,rw
